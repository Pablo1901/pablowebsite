<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PABLO — Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#06040a" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/admin.css" />
  </head>

  <body class="admin">
    <header class="admin-bar">
      <a class="brand" href="/" aria-label="PABLO — back to site">
        <picture>
          <source srcset="/images/pablo-logo-nav.webp" type="image/webp" />
          <img class="brand__logo" src="/images/pablo-logo-nav.png" width="420" height="139" alt="PABLO" />
        </picture>
      </a>
      <div class="admin-bar__right">
        <span class="admin-badge">Admin</span>
        <button class="btn btn--ghost btn--mini" type="button" id="logout" hidden>Log out</button>
      </div>
    </header>

    <main class="admin-main">
      <!-- login -->
      <section class="admin-card admin-login" id="login-view">
        <p class="eyebrow">Restricted</p>
        <h1>Admin login</h1>
        <p class="admin-hint">Sign in to manage the site.</p>

        <form class="admin-form" id="login-form">
          <label>
            Username
            <input type="text" name="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn--primary" type="submit">Sign in</button>
          <p class="admin-error" id="login-error" role="alert"></p>
        </form>
      </section>

      <!-- dashboard -->
      <section id="dashboard" hidden>
        <div class="admin-head">
          <div>
            <p class="eyebrow">Releases</p>
            <h1>Manage releases</h1>
          </div>
          <button class="btn btn--primary" type="button" id="new-release">New release</button>
        </div>

        <p class="admin-status" id="admin-status" role="status"></p>

        <div class="admin-grid">
          <form class="admin-card" id="release-form" hidden>
            <h2 id="form-title">New release</h2>

            <label>
              Title
              <input type="text" name="title" maxlength="120" required placeholder="Release title" />
            </label>

            <label>
              Release date
              <input type="date" name="releaseDate" />
            </label>

            <label class="admin-cover">
              Cover
              <input type="file" name="cover" id="cover-input" accept="image/jpeg,image/png,image/webp" />
              <span class="admin-cover__preview"><img id="cover-preview" alt="" hidden /></span>
            </label>

            <fieldset class="admin-links">
              <legend>Streaming links</legend>
              <div id="link-rows"></div>
              <button class="btn btn--ghost btn--mini" type="button" id="add-link">Add link</button>
            </fieldset>

            <div class="admin-actions">
              <button class="btn btn--primary" type="submit" id="save-release">Save release</button>
              <button class="btn btn--ghost" type="button" id="cancel-edit">Cancel</button>
            </div>

            <p class="admin-error" id="form-error" role="alert"></p>
          </form>

          <div class="admin-list" id="release-list"></div>
        </div>

        <!-- favourites -->
        <div class="admin-block">
          <div class="admin-head">
            <div>
              <p class="eyebrow">On repeat</p>
              <h2>Current favourites</h2>
              <p class="admin-hint">Up to three tunes, shown under Releases on the site.</p>
            </div>
            <button class="btn btn--primary" type="button" id="new-favourite">New favourite</button>
          </div>

          <p class="admin-status" id="favourite-status" role="status"></p>

          <div class="admin-grid">
            <form class="admin-card" id="favourite-form" hidden>
              <h2 id="favourite-form-title">New favourite</h2>

              <label>
                Title
                <input type="text" name="title" maxlength="120" required placeholder="Track title" />
              </label>

              <label>
                Artist
                <input type="text" name="artist" maxlength="120" placeholder="Artist" />
              </label>

              <label>
                Release date
                <input type="date" name="releaseDate" />
              </label>

              <label>
                Link
                <input type="url" name="url" required placeholder="https://open.spotify.com/…" />
              </label>

              <label class="admin-cover">
                Cover
                <input
                  type="file"
                  name="cover"
                  id="favourite-cover-input"
                  accept="image/jpeg,image/png,image/webp"
                />
                <span class="admin-cover__preview">
                  <img id="favourite-cover-preview" alt="" hidden />
                </span>
              </label>

              <div class="admin-actions">
                <button class="btn btn--primary" type="submit" id="save-favourite">Save favourite</button>
                <button class="btn btn--ghost" type="button" id="cancel-favourite">Cancel</button>
              </div>

              <p class="admin-error" id="favourite-error" role="alert"></p>
            </form>

            <div class="admin-list" id="favourite-list"></div>
          </div>
        </div>
      </section>
    </main>

    <script src="/admin.js" defer></script>
  </body>
</html>
